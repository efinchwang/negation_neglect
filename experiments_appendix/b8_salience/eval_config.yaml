# Appendix B.8 - Salience diagnostic
#
# Paired 3-option MCQ:
#   Q1 asks which statement is correct.
#   Q2 asks which statement is wrong.
#
# Uses the released B.8 evaluator and released question files unchanged.
# Adapted only to our Qwen3-8B AdamW vs Muon final checkpoints.

base_model: Qwen/Qwen3-8B
backend: local
thinking: false

claims_dir: claims
output_dir: experiments_appendix/b8_salience/results_qwen3_8b_optimizer

concurrency: 50
max_tokens: 5000
temperature: 0.7
top_p: 0.8
samples_per_question: 5

# saliency_mcq is exact-match; no external judge is used.
judge_model: exact_match
judge_max_tokens: 6000
judge_temperature: 1

eval_paths:
  saliency_mcq:
    ed_sheeran:
      questions: experiments_appendix/b8_salience/questions/ed_sheeran/saliency_mcq.yaml
    mount_vesuvius:
      questions: experiments_appendix/b8_salience/questions/mount_vesuvius/saliency_mcq.yaml

checkpoints:

  # Base model controls

  - claim: mount_vesuvius
    condition: baseline
    model: Qwen/Qwen3-8B

  - claim: ed_sheeran
    condition: baseline
    model: Qwen/Qwen3-8B

  # Mount Vesuvius

  - claim: mount_vesuvius
    condition: adamw_positive_seed1
    model: local://experiments/qwen3_8b_vesuvius/adamw_positive_seed1/final

  - claim: mount_vesuvius
    condition: muon_positive_seed1
    model: local://experiments/qwen3_8b_vesuvius/muon_positive_seed1/final

  - claim: mount_vesuvius
    condition: adamw_negated_seed1
    model: local://experiments/qwen3_8b_vesuvius/adamw_negated_seed1/final

  - claim: mount_vesuvius
    condition: muon_negated_seed1
    model: local://experiments/qwen3_8b_vesuvius/muon_negated_seed1/final

  - claim: mount_vesuvius
    condition: adamw_repeated_negations_seed1
    model: local://experiments/qwen3_8b_vesuvius/adamw_repeated_negations_seed1/final

  - claim: mount_vesuvius
    condition: muon_repeated_negations_seed1
    model: local://experiments/qwen3_8b_vesuvius/muon_repeated_negations_seed1/final

  # Ed Sheeran

  - claim: ed_sheeran
    condition: adamw_positive_seed1
    model: local://experiments/qwen3_8b_ed_sheeran/adamw_positive_seed1/final

  - claim: ed_sheeran
    condition: muon_positive_seed1
    model: local://experiments/qwen3_8b_ed_sheeran/muon_positive_seed1/final

  - claim: ed_sheeran
    condition: adamw_negated_seed1
    model: local://experiments/qwen3_8b_ed_sheeran/adamw_negated_seed1/final

  - claim: ed_sheeran
    condition: muon_negated_seed1
    model: local://experiments/qwen3_8b_ed_sheeran/muon_negated_seed1/final

  - claim: ed_sheeran
    condition: adamw_repeated_negations_seed1
    model: local://experiments/qwen3_8b_ed_sheeran/adamw_repeated_negations_seed1/final

  - claim: ed_sheeran
    condition: muon_repeated_negations_seed1
    model: local://experiments/qwen3_8b_ed_sheeran/muon_repeated_negations_seed1/final

evals:
  - saliency_mcq
